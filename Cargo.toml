[package]
name = "yabridge-manager"
version = "1.0.0"
edition = "2021"
authors = ["yabridge-manager contributors"]
description = "GUI manager for yabridge - Wine plugin bridge for Linux DAWs"
license = "GPL-3.0-or-later"

[[bin]]
name = "yabridge-manager"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", features = ["default", "persistence"] }
egui = "0.31"
egui_extras = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = "0.4"
regex = "1"
which = "7"
walkdir = "2"
shell-words = "1"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
